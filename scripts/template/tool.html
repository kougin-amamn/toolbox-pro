<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>{{名称}} | {{キャッチ}}</title>
    <meta name="description" content="{{説明}}" />
    <meta property="og:title" content="{{名称}} | {{キャッチ}}" />
    <meta property="og:description" content="{{説明}}" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:image" content="../../og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="./app-icon-{{slug}}.svg" />
    <link rel="stylesheet" href="../../common/site.css" />
    <link rel="stylesheet" href="../../common/tool.css" />
    <link rel="stylesheet" href="./{{slug}}.css" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "{{名称}}",
        "alternateName": ["{{英名}}"],
        "description": "{{説明}}",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any (Webブラウザ)",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "JPY"
        }
      }
    </script>
  </head>
  <body>
    <header class="site-bar">
      <img src="./app-icon-{{slug}}.svg" alt="" />
      <h1 style="margin: 0; font: inherit; flex: 1">{{名称}}<span class="en">{{英名}}</span></h1>
    </header>
    <main class="content">
      <div class="app">
        <p class="status" id="status"></p>
      </div>
    </main>
    <script src="../../common/log.js"></script>
    <script src="../../common/env.js"></script>
    <script src="../../common/site.js"></script>
    <script src="../../common/tool-kit.js"></script>
    <script>
      (window.ToolKit && window.ToolKit.media) ||
        document.body.insertAdjacentHTML(
          'afterbegin',
          '<p style="margin:16px;padding:12px 14px;border-radius:12px;background:#fdecec;color:#c93a3a;font:14px/1.6 sans-serif">共通ファイル(common/)を読み込めませんでした。https で配信したページ(または http://127.0.0.1 のローカルサーバー)で開いてください。</p>',
        );
    </script>
    <script src="./{{slug}}.js"></script>
  </body>
</html>
